<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interface de chat pour votre agent personnel." />
  <title>Personal AI Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Historique des discussions">
      <button id="new-chat" class="btn-primary new-chat" type="button"><i data-lucide="plus" aria-hidden="true"></i><span>Nouvelle discussion</span></button>
      <p class="sidebar-title">Historique</p>
      <ul id="session-list" class="session-list"></ul>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="sidebar-toggle" class="btn-ghost sidebar-toggle" type="button" aria-expanded="false" aria-controls="sidebar"><i data-lucide="panel-left" aria-hidden="true"></i><span>Historique</span></button>
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"><i data-lucide="bot"></i></span>
            <h1>Personal AI Agent</h1>
          </div>
        </div>
        <details class="settings">
          <summary class="btn-ghost"><i data-lucide="settings" aria-hidden="true"></i><span>Configuration</span></summary>
          <div class="settings-panel">
            <label for="backend-url">URL du backend</label>
            <div class="settings-row">
              <input id="backend-url" type="url" placeholder="https://votre-backend.exemple.com" autocomplete="off" />
              <button id="save-url" class="btn-primary" type="button"><i data-lucide="check" aria-hidden="true"></i><span>Enregistrer</span></button>
            </div>
            <p class="hint">Cette adresse est mémorisée dans ce navigateur.</p>
          </div>
        </details>
      </header>

      <main id="chat" class="chat" aria-live="polite">
        <div class="empty-state" id="empty-state">
          <span class="empty-icon" aria-hidden="true"><i data-lucide="message-square-text"></i></span>
          <h2>Comment puis-je vous aider ?</h2>
          <p>Posez une question, demandez la météo, consultez votre agenda, vos fichiers Drive ou votre espace Notion.</p>
        </div>
      </main>

      <form id="composer" class="composer" autocomplete="off">
        <textarea id="message" rows="1" placeholder="Écrivez votre message..." aria-label="Message"></textarea>
        <button id="send" class="btn-send" type="submit"><span>Envoyer</span><i data-lucide="send" aria-hidden="true"></i></button>
      </form>
      <p id="status" class="status" role="status"></p>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
